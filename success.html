<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142b3e"><title>Order status | FROST & CO.</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap');
*{box-sizing:border-box}body{margin:0;background:#fafbfb;color:#12283b;font:15px 'DM Sans',Arial,sans-serif}.hero{padding:70px 20px;background:linear-gradient(125deg,#142b3e,#385c75);color:white;text-align:center}.hero h1{font:500 clamp(36px,5vw,56px) 'Playfair Display',serif;margin:12px}.card{max-width:650px;margin:40px auto;padding:32px 24px;background:white;border:1px solid #dbe5e9;text-align:center;line-height:1.8}.muted{color:#667b89}.button{display:inline-block;background:#12283b;color:white;padding:14px 22px;text-decoration:none;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
</style></head><body><header class="hero"><div style="letter-spacing:.2em;font-size:12px">FROST & CO.</div><h1 id="heading">Checking your payment…</h1><p id="message">Please keep this page open for a moment.</p></header><main class="card"><p id="details" class="muted">Verifying payment directly with Stripe.</p><a class="button" href="index.html">Return to shop</a></main>
<script>
(async()=>{
 const heading=document.getElementById('heading'), message=document.getElementById('message'), details=document.getElementById('details');
 const sessionId=new URLSearchParams(location.search).get('session_id');
 if(!sessionId){heading.textContent='No order reference';message.textContent='We could not find a checkout session in this link.';details.textContent='If you completed payment, contact the store owner with your Stripe receipt.';return;}
 try{
   const r=await fetch('/api/order-status?session_id='+encodeURIComponent(sessionId));
   const d=await r.json();
   if(!r.ok) throw new Error(d.error||'Unable to verify payment');
   if(d.payment_status==='paid'){
     heading.textContent='Payment confirmed';
     message.textContent='Thank you for your order.';
     details.textContent='Order total: '+new Intl.NumberFormat('en-IE',{style:'currency',currency:(d.currency||'eur').toUpperCase()}).format((d.amount_total||0)/100)+'. A receipt will be sent by Stripe if receipts are enabled in the Stripe Dashboard.';
     try{localStorage.removeItem('frost-cart')}catch(_){}
   } else {
     heading.textContent='Payment not confirmed yet';
     message.textContent='Stripe has not marked this checkout as paid.';
     details.textContent='Do not place a second order immediately. Check your email and contact the store if payment was taken.';
   }
 }catch(e){heading.textContent='Could not verify order';message.textContent='Please refresh in a moment or contact the store owner.';details.textContent=e.message||'Verification failed.';}
})();
</script></body></html>
